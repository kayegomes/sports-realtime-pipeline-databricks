name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancela execucoes antigas do mesmo branch: nao ha motivo para testar um
# commit que ja foi substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  JAVA_VERSION: "11"
  # Fuso fixo: agregacoes por janela de tempo nao podem depender do fuso do runner.
  TZ: UTC

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar o ruff
        run: pip install ruff==0.4.8

      - name: Verificar estilo e imports
        run: |
          ruff check src tests
          ruff format --check --diff src tests

  tests:
    name: Testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O PySpark roda na JVM: sem Java, nada funciona.
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # O jar do Delta Lake e baixado do Maven na primeira SparkSession.
      # Guardar em cache economiza ~1 minuto por execucao.
      - name: Cache dos jars do Ivy/Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.m2/repository
          key: ivy-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ivy-${{ runner.os }}-

      - name: Rodar os testes
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Publicar o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  smoke-test:
    name: Smoke test ponta a ponta
    runs-on: ubuntu-latest
    needs: tests
    env:
      SPORTS_DATA_ROOT: ${{ github.workspace }}/ci_run/data
      SPORTS_DELTA_ROOT: ${{ github.workspace }}/ci_run/delta
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache dos jars do Ivy/Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.m2/repository
          key: ivy-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ivy-${{ runner.os }}-

      # Cada camada roda com `--once` (trigger availableNow): processa o
      # backlog disponivel e encerra. E o mesmo codigo do modo continuo.
      - name: Gerar eventos
        run: python -m src.generator.event_generator --max-ticks 5 --interval 0 --matches 2 --seed 42

      - name: Camada Bronze
        run: python -m src.bronze.ingest_bronze --once

      - name: Camada Silver
        run: python -m src.silver.transform_silver --once

      - name: Camada Gold
        run: python -m src.gold.aggregate_gold --once

      - name: Validar as tabelas Delta
        run: python scripts/validate_pipeline.py
